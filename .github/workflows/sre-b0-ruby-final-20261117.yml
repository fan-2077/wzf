name: B0 final frozen Ruby syntax qualification
on:
  push:
    branches: [sre-b0-ruby-final-20261117]
    paths: [b0-ruby-syntax/**, .github/workflows/sre-b0-ruby-final-20261117.yml]
permissions:
  contents: read
concurrency:
  group: sre-b0-ruby-final-20261117
  cancel-in-progress: false
jobs:
  parse-only:
    if: github.repository == 'fan-2077/wzf' && github.ref == 'refs/heads/sre-b0-ruby-final-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Read frozen parse-only input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /b0-ruby-syntax/
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
      - name: Parse eight programs without executing their bodies
        timeout-minutes: 15
        run: python3 -B b0-ruby-syntax/check.py
      - name: Preserve exact inputs and complete parse outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sre-b0-ruby-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: b0-ruby-syntax-result/
          if-no-files-found: error
          retention-days: 14
