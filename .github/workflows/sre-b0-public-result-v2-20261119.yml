name: B0-P v2 original-task result after writer observation fix
on:
  push:
    branches: [sre-b0-public-result-v2-20261119]
    paths: [b0-run/**, tools/check_b0_ruby_syntax.py, tests/test_final_admission_contract.py, .github/workflows/sre-b0-public-result-v2-20261119.yml]
permissions:
  contents: read
concurrency:
  group: sre-b0-public-result-v2-20261119
  cancel-in-progress: false
jobs:
  original-public-b0:
    if: github.repository == 'fan-2077/wzf' && github.ref == 'refs/heads/sre-b0-public-result-v2-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Read the exact reviewed candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /b0-run/
            /tools/check_b0_ruby_syntax.py
            /tests/test_final_admission_contract.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
      - name: Verify real final admission contracts locally
        timeout-minutes: 1
        run: python3 -B -m unittest discover -s tests -p test_final_admission_contract.py -v
      - name: Compile exact changed Ruby bodies in the fixed image
        timeout-minutes: 18
        run: python3 -B tools/check_b0_ruby_syntax.py
      - name: Run one fresh original-task public baseline
        timeout-minutes: 204
        run: python3 -B b0-run/run_remote_baseline.py
      - name: Verify owned cleanup on every outcome
        if: always() && hashFiles('b0-results/ownership.json') != ''
        timeout-minutes: 2
        run: python3 -B b0-run/cleanup_owned.py --scope b0-results/ownership.json --full
      - name: Seal complete owned evidence after cleanup
        id: seal
        if: always()
        timeout-minutes: 2
        run: python3 -B b0-run/seal_remote_evidence.py
      - name: Preserve original evidence including failed attempts
        if: always() && steps.seal.outputs.evidence_paths_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 3
        with:
          name: sre-b0-public-result-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sre-b0-export-${{ github.run_id }}-${{ github.run_attempt }}/evidence.tar.gz
            ${{ runner.temp }}/sre-b0-export-${{ github.run_id }}-${{ github.run_attempt }}/EXPORT_STATUS.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
      - name: Preserve exact syntax qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 2
        with:
          name: sre-b0-v2-syntax-${{ github.run_id }}-${{ github.run_attempt }}
          path: writer-fence-syntax-results/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
