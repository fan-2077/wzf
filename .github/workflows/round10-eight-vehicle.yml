name: Round 10 eight-vehicle joint assignment
on:
  push:
    branches: [round10-eight-vehicle-20261116]
    paths:
      - 'experiments/round10_joint.py'
      - '.github/workflows/round10-eight-vehicle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exhaustive-eight-vehicle:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record environment
        run: |
          mkdir -p results
          { uname -a; lscpu; free -h; df -h; python --version; } > results/environment.txt
      - name: Clone pinned public simulator and demand
        run: |
          python -m pip install --quiet pybind11
          git clone https://github.com/cityflow-project/CityFlow.git upstream/CityFlow
          git -C upstream/CityFlow fetch --depth=1 origin 81ee0f47659ca66177a71f81676691c58ee89184
          git -C upstream/CityFlow checkout --detach FETCH_HEAD
          git -C upstream/CityFlow submodule update --init --depth=1 extern/rapidjson
          git clone https://github.com/usail-hkust/CoLLMLight.git upstream/CoLLMLight
          git -C upstream/CoLLMLight fetch --depth=1 origin ce204a90a238e206fa5673b6922aab3a6a9fc597
          git -C upstream/CoLLMLight checkout --detach FETCH_HEAD
          mkdir -p native_build
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path.cwd();city=root/'upstream/CityFlow'
          engine_h=city/'src/engine/engine.h';a=engine_h.read_text()
          if '#include <stdexcept>' not in a:a=a.replace('#include <fstream>','#include <fstream>\n#include <stdexcept>')
          needle='        void setTrafficLightPhase(const std::string &id, int phaseIndex);'
          method='''        int observeTrafficLightPhase(const std::string &id) const {
              Intersection *intersection = roadnet.getIntersectionById(id);
              if (intersection == nullptr) throw std::out_of_range("unknown intersection");
              return intersection->getTrafficLight().getCurrentPhaseIndex();
          }
          '''
          assert a.count(needle)==1
          engine_h.write_text(a.replace(needle,method+needle))
          cpp=city/'src/cityflow.cpp';a=cpp.read_text()
          needle='        .def("set_tl_phase", &CityFlow::Engine::setTrafficLightPhase, "intersection_id"_a, "phase_id"_a)'
          assert a.count(needle)==1
          cpp.write_text(a.replace(needle,'        .def("observe_tl_phase", &CityFlow::Engine::observeTrafficLightPhase, "intersection_id"_a)\n'+needle))
          data=root/'upstream/CoLLMLight/data/Hangzhou/4_4'
          expected={'roadnet_4_4.json':'11e2fe89f632e43e81f56ea87a308d544b66f9c5af8a410e16149668d6d376c1','anon_4_4_hangzhou_real.json':'595a6140e6649efe5be1b274eb8b03e8c4029e517c9ac2ad53c9ea556a414213'}
          for name,sha in expected.items():assert hashlib.sha256((data/name).read_bytes()).hexdigest()==sha
          (root/'results/source_commits.json').write_text(json.dumps({'CityFlow':'81ee0f47659ca66177a71f81676691c58ee89184','CoLLMLight':'ce204a90a238e206fa5673b6922aab3a6a9fc597','data_sha256':expected},indent=2))
          PY
      - name: Build native CityFlow with read-only phase observer
        run: |
          python - <<'PY'
          from pathlib import Path
          import sysconfig,pybind11,subprocess
          root=Path.cwd();city=root/'upstream/CityFlow'
          files=['utility/utility.cpp','utility/barrier.cpp','engine/archive.cpp','engine/engine.cpp','flow/flow.cpp','roadnet/roadnet.cpp','roadnet/trafficlight.cpp','vehicle/router.cpp','vehicle/vehicle.cpp','vehicle/lanechange.cpp','cityflow.cpp']
          cmd=['g++','-O1','-shared','-std=c++11','-fPIC','-pthread','-DRAPIDJSON_HAS_STDSTRING=1','-I'+str(city/'src'),'-I'+str(city/'extern/rapidjson/include'),'-I'+str(city/'extern/milo'),'-I'+pybind11.get_include(),'-I'+sysconfig.get_paths()['include'],*[str(city/'src'/x) for x in files],'-o',str(root/'native_build'/('cityflow'+sysconfig.get_config_var('EXT_SUFFIX')))]
          with open('results/native_build.log','w') as f:subprocess.run(cmd,check=True,stdout=f,stderr=subprocess.STDOUT,timeout=600)
          PY
      - name: Run 8-vehicle discovery and 256 joint simulations
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 6000s python -u experiments/round10_joint.py | tee results/round10.log
          test -s results/round10/frozen_eight_candidates.json
          test -s results/round10/joint/summary.json
      - name: Preserve all results and failures
        if: always()
        run: |
          cp experiments/round10_joint.py results/round10_joint.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('results')
          (root/'manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()},indent=2))
          PY
      - name: Upload bounded experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: round10-eight-vehicle-evidence
          path: results/
          retention-days: 14
