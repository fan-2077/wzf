name: B1 real model feedback after optional UI build fix
on:
  push:
    branches: [sre-b1-readonly-ui-off-20261119]
    paths: [g1-smoke/**, b1-readonly-gate/**, b1-run-plan/**, .github/workflows/sre-b1-readonly-ui-off-20261119.yml]
permissions:
  contents: read
concurrency:
  group: sre-b1-readonly-ui-off-20261119
  cancel-in-progress: false
jobs:
  readonly-feedback:
    if: github.repository == 'fan-2077/wzf' && github.ref == 'refs/heads/sre-b1-readonly-ui-off-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 96
    steps:
      - name: Read the exact reviewed sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /g1-smoke/
            /b1-readonly-gate/
            /b1-run-plan/
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source binding and derive the exact reviewed package
        timeout-minutes: 1
        run: |
          python3 -B - <<'PY'
          import hashlib, importlib.util, json
          from pathlib import Path
          root = Path.cwd()
          plan = json.loads((root / 'b1-run-plan/PREREGISTRATION.json').read_text())
          source = root / 'b1-readonly-gate'
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          manifest_path = source / 'SOURCE_MANIFEST.json'
          if sha(manifest_path) != plan['source_manifest_sha256']:
              raise RuntimeError('Reviewed overlay source manifest differs')
          manifest = json.loads(manifest_path.read_text())
          paths = list(source.rglob('*'))
          if any(p.is_symlink() for p in paths):
              raise RuntimeError('Overlay source contains a symlink')
          actual = {str(p.relative_to(source)) for p in paths if p.is_file() and p != manifest_path}
          if actual != set(manifest['files']):
              raise RuntimeError('Reviewed overlay source file set differs')
          for name, digest in manifest['files'].items():
              if sha(source / name) != digest:
                  raise RuntimeError('Reviewed overlay source differs: ' + name)
          spec = importlib.util.spec_from_file_location('readonly_builder', source / 'build_overlay.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          summary = module.build(root / 'g1-smoke', root / 'generated-b1-readonly-package', plan['branch'])
          (root / 'b1-build-result.json').write_text(json.dumps(summary, indent=2) + '\n')
          if summary['generated_manifest_sha256'] != plan['generated_package_manifest_sha256']:
              raise RuntimeError('Derived package differs from the reviewed exact bytes')
          print(json.dumps(summary))
          PY
      - name: Run one bounded real model readonly feedback experiment
        timeout-minutes: 84
        run: python3 -B generated-b1-readonly-package/run_remote_smoke.py
      - name: Verify owned cleanup on every outcome
        if: always() && hashFiles('g1-results/ownership.json') != ''
        timeout-minutes: 2
        run: python3 -B generated-b1-readonly-package/cleanup_owned.py --scope g1-results/ownership.json --full
      - name: Seal complete evidence after cleanup
        id: seal
        if: always() && hashFiles('generated-b1-readonly-package/seal_remote_evidence.py') != ''
        timeout-minutes: 2
        run: python3 -B generated-b1-readonly-package/seal_remote_evidence.py
      - name: Preserve original evidence including failed attempts
        if: always() && steps.seal.outputs.evidence_paths_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 3
        with:
          name: sre-b1-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sre-g1-export-${{ github.run_id }}-${{ github.run_attempt }}/evidence.tar.gz
            ${{ runner.temp }}/sre-g1-export-${{ github.run_id }}-${{ github.run_attempt }}/EXPORT_STATUS.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
      - name: Preserve frozen launch and package generation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 2
        with:
          name: sre-b1-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            b1-run-plan/PREREGISTRATION.json
            b1-readonly-gate/SOURCE_MANIFEST.json
            b1-build-result.json
            generated-b1-readonly-package/PACKAGE_MANIFEST.json
            generated-b1-readonly-package/OVERLAY_MANIFEST.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
